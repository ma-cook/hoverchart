name: Native Build & Test

on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            artifact: hoverchart-linux-x64
          - os: windows-latest
            target: x86_64-windows-gnu
            artifact: hoverchart-windows-x64.exe
          - os: macos-latest
            target: aarch64-macos
            artifact: hoverchart-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.14.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      # ── Vendor setup (cached) ──────────────────────────────────────────────

      - name: Cache vendor
        uses: actions/cache@v4
        id: vendor-cache
        with:
          path: native/vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('native/build.zig') }}

      - name: Clone tree-sitter grammars
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        working-directory: native
        shell: bash
        run: |
          mkdir -p vendor
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter              vendor/tree-sitter
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-javascript   vendor/tree-sitter-javascript
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-typescript   vendor/tree-sitter-typescript
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-python       vendor/tree-sitter-python
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-go           vendor/tree-sitter-go
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-rust         vendor/tree-sitter-rust
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-java         vendor/tree-sitter-java
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-c-sharp      vendor/tree-sitter-c-sharp
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-ruby         vendor/tree-sitter-ruby
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-php          vendor/tree-sitter-php
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-cpp          vendor/tree-sitter-cpp
          git clone --depth=1 https://github.com/tree-sitter/tree-sitter-c            vendor/tree-sitter-c
          git clone --depth=1 https://github.com/freetype/freetype                    vendor/freetype

      # ── Zig package fetch ──────────────────────────────────────────────────

      - name: Cache Zig global cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-${{ runner.os }}-${{ hashFiles('native/build.zig.zon') }}

      - name: Fetch Zig dependencies
        working-directory: native
        run: zig fetch --save https://github.com/zig-gamedev/zig-gamedev/archive/refs/heads/main.zip

      # ── Build (no GUI — test targets only in CI) ──────────────────────────

      - name: Run tests
        working-directory: native
        run: zig build test

      # ── Upload artifact ───────────────────────────────────────────────────
      # Full GUI build is skipped in CI because wgpu-native requires a display.
      # A separate release workflow handles packaged builds.

  # ── Lint / format check ───────────────────────────────────────────────────

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0
      - name: Check formatting
        working-directory: native
        run: zig fmt --check src/
