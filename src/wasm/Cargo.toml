[package]
name = "hoverchart-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
# Optimise for speed (SIMD auto-vectorisation)
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
# binaryen (wasm-opt) is not available in CI; rustc release optimisations
# (opt-level=3 + LTO) are sufficient.
wasm-opt = false
